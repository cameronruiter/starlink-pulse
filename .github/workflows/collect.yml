name: Collect Starlink posts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      backfill_hours:
        description: "Catch up on the last N hours (only for the very first run, e.g. 48). Leave 0 for a normal run."
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-collector.txt

      - name: Cache the Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-twitter-roberta-sentiment-latest

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-collector.txt

      - name: Fetch, analyse and store
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python collector.py --backfill-hours "${{ github.event.inputs.backfill_hours || '0' }}"

      - name: Save data to the repo
        run: |
          git config user.name "starlink-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
